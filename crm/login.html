<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusAmigo CRM | Iniciar sesión</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/crm.css">
</head>
<body>
  <header></header>
  <main id="main-content" class="container auth-wrap">
    <section class="card crm-access-card">
      <div class="auth-head">
        <span class="eyebrow">CAMPUSAMIGO / CRM</span>
        <h1>Gestiona cada relación.</h1>
        <p>Accede al historial, clasificación y seguimiento de clientes.</p>
      </div>
      <div id="loginMsg" class="notice" hidden></div>
      <form id="loginForm" class="auth-form">
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" class="input" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" class="input" type="password" autocomplete="current-password" required minlength="8">
        </div>
        <button id="loginSubmit" class="btn primary block" type="submit">Ingresar al CRM</button>
      </form>
      <p class="small crm-access-note">Área interna de CampusAmigo. El acceso y las acciones quedan asociados a cada usuario.</p>
    </section>
  </main>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/crm_api.js"></script>
  <script src="../js/crm_nav.js"></script>
  <script src="../js/crm_login.js"></script>
</body>
</html>
