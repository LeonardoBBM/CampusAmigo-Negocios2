<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusAmigo CRM | Configuración inicial</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/crm.css">
</head>
<body>
  <header></header>
  <main id="main-content" class="container auth-wrap">
    <section class="card crm-access-card">
      <div class="auth-head">
        <span class="eyebrow">CAMPUSAMIGO / CRM</span>
        <h1>Configura la administración.</h1>
        <p>Crea la primera cuenta administradora. Este paso solo estará disponible una vez.</p>
      </div>
      <div id="setupMsg" class="notice" hidden></div>
      <form id="setupForm" class="auth-form">
        <div class="field">
          <label for="name">Nombre completo</label>
          <input id="name" class="input" autocomplete="name" required minlength="2" maxlength="100">
        </div>
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" class="input" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" class="input" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
        </div>
        <div class="field">
          <label for="passwordConfirm">Confirmar contraseña</label>
          <input id="passwordConfirm" class="input" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
        </div>
        <button id="setupSubmit" class="btn primary block" type="submit">Crear administrador</button>
      </form>
      <p class="small crm-access-note">La contraseña se almacena de forma derivada; nunca se guarda el texto original.</p>
    </section>
  </main>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/crm_api.js"></script>
  <script src="../js/crm_nav.js"></script>
  <script src="../js/crm_setup.js"></script>
</body>
</html>
