<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusAmigo CRM | Interacciones</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/crm.css">
</head>
<body>
  <header></header>
  <main id="main-content" class="container">
    <div class="crm-welcome">
      <div>
        <span class="eyebrow">CRM / SEGUIMIENTO</span>
        <h1 style="margin:10px 0 8px">Interacciones</h1>
        <p style="margin:0">Consulta el contacto registrado con cada cliente y quién fue responsable.</p>
      </div>
      <a class="btn primary" href="clientes.html">Elegir cliente para registrar</a>
    </div>
    <div id="interactionMsg" class="notice" hidden></div>
    <section class="card">
      <div class="crm-toolbar">
        <div class="crm-toolbar-filters">
          <label class="sr-only" for="interactionSearch">Buscar interacciones</label>
          <input id="interactionSearch" class="input" placeholder="Buscar por cliente o descripción">
          <label class="sr-only" for="interactionTypeFilter">Tipo</label>
          <select id="interactionTypeFilter">
            <option value="">Todos los tipos</option>
            <option value="llamada">Llamada</option>
            <option value="correo">Correo</option>
            <option value="reunion">Reunión</option>
            <option value="otro">Otro</option>
          </select>
          <label class="sr-only" for="responsibleFilter">Responsable</label>
          <select id="responsibleFilter">
            <option value="">Todos los responsables</option>
          </select>
        </div>
        <span id="interactionCount" class="pill">0 interacciones</span>
      </div>
      <table class="table" style="margin-top:18px">
        <thead><tr><th>Fecha</th><th>Cliente</th><th>Tipo</th><th>Descripción</th><th>Responsable</th><th class="right">Expediente</th></tr></thead>
        <tbody id="interactionRows"><tr><td colspan="6" class="small">Cargando interacciones…</td></tr></tbody>
      </table>
    </section>
  </main>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/crm_api.js"></script>
  <script src="../js/crm_nav.js"></script>
  <script src="../js/crm_interacciones.js"></script>
</body>
</html>
